<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="KAKASHI8121 — AI × CODE × SYSTEMS">
  <defs>
    <radialGradient id="bgD" cx="28%" cy="40%" r="95%">
      <stop offset="0%" stop-color="#1A0404"/>
      <stop offset="45%" stop-color="#0D0505"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="lineD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2D2D"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="irisD" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#5A0808"/>
      <stop offset="60%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#2B0000"/>
    </radialGradient>
    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridD" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF2D2D" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bgD)"/>
  <rect width="1000" height="280" rx="18" fill="url(#gridD)"/>
  <rect x="1.5" y="1.5" width="997" height="277" rx="17" fill="none" stroke="#8B0000" stroke-opacity="0.85"/>
  <rect x="7" y="7" width="986" height="266" rx="13" fill="none" stroke="#FF2D2D" stroke-opacity="0.14"/>

  <g stroke="#FF2D2D" fill="none">
    <circle cx="965" cy="140" r="150" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="965" cy="140" r="110" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle cx="965" cy="140" r="70" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.08;0.30;0.08" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(150 140) scale(0.82)" filter="url(#glowD)">
    <circle r="88" fill="none" stroke="#FF2D2D" stroke-width="5">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="url(#irisD)" stroke="#C01818" stroke-width="3"/>
    <circle r="15" fill="#1A0000"/>
    <g fill="#E41414">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      <g id="tomoeD"><circle cx="0" cy="-46" r="12.5"/><path d="M9 -52 C 30 -46, 36 -24, 25 -8 C 31 -28, 22 -40, 5 -40 Z"/></g>
      <use href="#tomoeD" transform="rotate(120)"/>
      <use href="#tomoeD" transform="rotate(240)"/>
    </g>
  </g>

  <line x1="285" y1="54" x2="285" y2="226" stroke="url(#lineD)" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <line x1="320" y1="84" x2="758" y2="84" stroke="url(#lineD)" stroke-width="2"/>
    <circle cx="764" cy="84" r="3.5" fill="#FF2D2D"/>
    <text x="320" y="128" font-size="54" font-weight="bold" letter-spacing="7" fill="#FFFFFF" filter="url(#glowD)">KAKASHI8121</text>
    <text x="322" y="168" font-size="21" letter-spacing="10" fill="#FF4040">AI × CODE × SYSTEMS</text>
    <text x="322" y="202" font-size="13.5" letter-spacing="4.5" fill="#9AA3AD">SRIHAREE R — AI &amp; SOFTWARE ENGINEER — CHENNAI · IN</text>
  </g>
</svg>
