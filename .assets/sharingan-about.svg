<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Sharingan-inspired brand mark">
  <defs>
    <radialGradient id="irisA" cx="50%" cy="44%" r="64%">
      <stop offset="0%" stop-color="#6E0909"/>
      <stop offset="55%" stop-color="#A50F0F"/>
      <stop offset="100%" stop-color="#300202"/>
    </radialGradient>
    <filter id="glowA" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g stroke="#FF2D2D" fill="none" opacity="0.5">
    <circle cx="150" cy="150" r="138" stroke-opacity="0.45" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.20;0.60;0.20" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="122" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <g transform="translate(150 150)" filter="url(#glowA)">
    <circle r="100" fill="none" stroke="#FF2D2D" stroke-width="6">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="84" fill="url(#irisA)" stroke="#C01818" stroke-width="3"/>
    <circle r="17" fill="#180000"/>
    <circle r="17" fill="none" stroke="#FF2D2D" stroke-opacity="0.65" stroke-width="1.5">
      <animate attributeName="r" values="15;19;15" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g fill="#E41414">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      <g id="tomoeA"><circle cx="0" cy="-54" r="14.5"/><path d="M10.5 -61 C 35 -54, 42 -28, 29 -9 C 36 -32, 26 -46, 6 -45 Z"/></g>
      <use href="#tomoeA" transform="rotate(120)"/>
      <use href="#tomoeA" transform="rotate(240)"/>
    </g>
  </g>
</svg>
