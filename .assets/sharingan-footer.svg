<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Sharingan emblem">
  <defs>
    <radialGradient id="irisF" cx="50%" cy="44%" r="64%">
      <stop offset="0%" stop-color="#6E0909"/>
      <stop offset="55%" stop-color="#A50F0F"/>
      <stop offset="100%" stop-color="#300202"/>
    </radialGradient>
    <filter id="glowF" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(75 75)" filter="url(#glowF)">
    <circle r="62" fill="none" stroke="#FF2D2D" stroke-width="4">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="51" fill="url(#irisF)" stroke="#C01818" stroke-width="2.5"/>
    <circle r="10.5" fill="#180000"/>
    <g fill="#E41414">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
      <g id="tomoeF"><circle cx="0" cy="-33" r="9"/><path d="M6.5 -37.5 C 21.5 -33.5, 26 -17.5, 18 -5.5 C 22.5 -20, 16 -28.5, 4 -28 Z"/></g>
      <use href="#tomoeF" transform="rotate(120)"/>
      <use href="#tomoeF" transform="rotate(240)"/>
    </g>
  </g>
</svg>
