<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="KAKASHI8121 — AI × CODE × SYSTEMS">
  <defs>
    <radialGradient id="bgL" cx="28%" cy="40%" r="95%">
      <stop offset="0%" stop-color="#FFF3F2"/>
      <stop offset="50%" stop-color="#FBFAFA"/>
      <stop offset="100%" stop-color="#F2F2F4"/>
    </radialGradient>
    <linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B31212"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="irisL" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7A0A0A"/>
      <stop offset="60%" stop-color="#B31212"/>
      <stop offset="100%" stop-color="#4A0505"/>
    </radialGradient>
    <filter id="glowL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B31212" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bgL)"/>
  <rect width="1000" height="280" rx="18" fill="url(#gridL)"/>
  <rect x="1.5" y="1.5" width="997" height="277" rx="17" fill="none" stroke="#D8D8DC"/>
  <rect x="7" y="7" width="986" height="266" rx="13" fill="none" stroke="#B31212" stroke-opacity="0.18"/>

  <g stroke="#B31212" fill="none">
    <circle cx="965" cy="140" r="150" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle cx="965" cy="140" r="110" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="965" cy="140" r="70" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.06;0.22;0.06" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(150 140) scale(0.82)" filter="url(#glowL)">
    <circle r="88" fill="none" stroke="#B31212" stroke-width="5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="url(#irisL)" stroke="#8B0000" stroke-width="3"/>
    <circle r="15" fill="#2B0000"/>
    <g fill="#A50F0F">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      <g id="tomoeL"><circle cx="0" cy="-46" r="12.5"/><path d="M9 -52 C 30 -46, 36 -24, 25 -8 C 31 -28, 22 -40, 5 -40 Z"/></g>
      <use href="#tomoeL" transform="rotate(120)"/>
      <use href="#tomoeL" transform="rotate(240)"/>
    </g>
  </g>

  <line x1="285" y1="54" x2="285" y2="226" stroke="url(#lineL)" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <line x1="320" y1="84" x2="758" y2="84" stroke="url(#lineL)" stroke-width="2"/>
    <circle cx="764" cy="84" r="3.5" fill="#B31212"/>
    <text x="320" y="128" font-size="54" font-weight="bold" letter-spacing="7" fill="#16181D" filter="url(#glowL)">KAKASHI8121</text>
    <text x="322" y="168" font-size="21" letter-spacing="10" fill="#B31212">AI × CODE × SYSTEMS</text>
    <text x="322" y="202" font-size="13.5" letter-spacing="4.5" fill="#57606A">SRIHAREE R — AI &amp; SOFTWARE ENGINEER — CHENNAI · IN</text>
  </g>
</svg>
